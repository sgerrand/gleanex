name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      # An old version failing should not hide the result on a newer one.
      fail-fast: false
      matrix:
        # One row per Elixir minor the package supports, each on the newest OTP
        # that minor builds against. The floor is the `elixir:` requirement in
        # mix.exs; the top row is what .tool-versions pins and therefore what
        # every other job here runs, so bumping .tool-versions means bumping it
        # here too. Versions are spelled out because setup-beam reads a single
        # pair from .tool-versions and a matrix needs several.
        include:
          - elixir: "1.18.4"
            otp: "27.3.4.16"
          - elixir: "1.19.5"
            otp: "28.5.0.5"
          - elixir: "1.20.2"
            otp: "29.0.4"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Restore dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      # --cover enforces the 100% threshold set in mix.exs, so a new branch
      # arriving without a test fails here rather than at review.
      - run: mix test --cover

  lint:
    name: Formatting and Credo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          # Single source of truth for the versions, shared with local asdf/mise
          # setups. strict takes them as written rather than resolving a range.
          version-file: .tool-versions
          version-type: strict

      - name: Restore dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # --check-locked fails rather than rewriting mix.lock, so a mix.exs change
      # committed without its lockfile update is caught here.
      - run: mix deps.get --check-locked

      # Fails if mix.lock has entries no longer reachable from mix.exs.
      - run: mix deps.unlock --check-unused

      # Pinned rather than run across the matrix: the formatter's output moves
      # between Elixir versions, so checking it on more than one would ask the
      # tree to satisfy every version at once.
      - run: mix format --check-formatted

      - run: mix credo --strict

  markdown:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Kept out of the lint job above: mado is a standalone binary, so this
      # needs neither the BEAM nor the dependency cache. Rules and exclusions
      # live in mado.toml, which the action's default `check .` picks up, so a
      # local `mado check` behaves the same as CI.
      - uses: akiomik/mado@177695b4d2cd6b107f881a8e91067cc7588fb129 # v0.3.1

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          # Single source of truth for the versions, shared with local asdf/mise
          # setups. strict takes them as written rather than resolving a range.
          version-file: .tool-versions
          version-type: strict

      - name: Restore dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Regeneration reads the descriptions committed in priv/openapi, so this
      # needs no network access and cannot be affected by an upstream change
      # landing mid-run.
      - name: Regenerate all four APIs
        run: mix glean.gen

      # --porcelain rather than `git diff`, so a newly generated file that is not
      # yet tracked counts as drift too.
      - name: Fail if regeneration changed anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code does not match priv/openapi. Run 'mix glean.gen' and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          # Single source of truth for the versions, shared with local asdf/mise
          # setups. strict takes them as written rather than resolving a range.
          version-file: .tool-versions
          version-type: strict

      - name: Restore dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # The PLT is expensive to build and only changes when the compiler or the
      # dependencies do, so it is cached separately from the build.
      - name: Restore PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - run: mix dialyzer --format github
