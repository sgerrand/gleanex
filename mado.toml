# Markdown linting, run by the `markdown` job in .github/workflows/ci.yml.
# Only the departures from mado's defaults are listed; every other rule is on.

[lint]
# CHANGELOG.md is generated by release-please from commit messages, so its
# formatting is not ours to fix.
exclude = ["./CHANGELOG.md"]

[lint.md013]
# Prose is still held to 80 columns. Code samples and tables are not: wrapping
# either one would either break the sample or make the table unreadable.
code-blocks = false
tables = false
